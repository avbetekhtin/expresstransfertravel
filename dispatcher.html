<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Диспетчерская — Экспресс Трансфер Трэвел</title><style>:root{color-scheme:dark;--bg:#0e1518;--card:#172126;--line:#304047;--gold:#d8b56a;--muted:#a8b3b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#27363a 0,transparent 38%),var(--bg);color:#f4f1e8;font:15px system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:32px 22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.top h1{font:42px Georgia,serif;margin:8px 0 0}.muted{color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);border-radius:9px;background:#202e33;color:#fff;padding:10px 14px;cursor:pointer;font-weight:700}.btn.primary{background:var(--gold);color:#1b2426;border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:24px}.card{background:rgba(23,33,38,.92);border:1px solid var(--line);border-radius:16px;padding:18px}.card h2{font:23px Georgia,serif;margin:0 0 12px}.order{grid-column:1/-1}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{border-radius:999px;background:#34464d;color:#f0d58f;padding:5px 9px;font-size:12px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;color:var(--muted);font-size:13px;margin:13px 0}.meta b{display:block;color:#fff;font-size:14px;margin-top:3px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:end}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0f191d;color:#fff;padding:10px;font:inherit}.notice{padding:16px;border:1px dashed var(--line);border-radius:12px;margin-top:22px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:22px 14px}.top{display:block}.top h1{font-size:34px}.grid{grid-template-columns:1fr}.order{grid-column:auto}.meta{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">операционный контур</div><h1>Диспетчерская</h1><p class="muted" id="identity">Проверка сессии…</p></div><div class="actions"><button class="btn" id="refresh">Обновить</button><button class="btn" id="logout">Выйти</button></div></header><section class="grid"><article class="card"><h2>Сводка</h2><div id="summary" class="muted">Загрузка…</div></article><article class="card"><h2>Водители</h2><div id="drivers" class="muted">Загрузка…</div></article><article class="card"><h2>Правило назначения</h2><p class="muted">Машина назначается только при совпадении зарегистрированного водителя, модели и госномера.</p></article><article class="card order"><h2>Заявки</h2><div id="orders" class="muted">Загрузка…</div></article></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(p,o)=>{const r=await fetch(p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};let users=[];
async function load(){try{const me=await api('/api/auth/me');if(!me.user||!['admin','dispatcher'].includes(me.user.role)){document.body.innerHTML='<main class="wrap"><h1>Доступ закрыт</h1><p class="muted">Нужна роль admin или dispatcher.</p></main>';return}document.querySelector('#identity').textContent=`${me.user.name} · ${me.user.role}`;const [list,ol]=await Promise.all([api('/api/users'),api('/api/orders')]);users=list.users.filter(u=>u.role==='driver');document.querySelector('#drivers').innerHTML=users.map(u=>`<div>${esc(u.name)} · ${esc(u.car||'нет машины')} · ${esc(u.plate||'нет номера')}</div>`).join('')||'Нет водителей';document.querySelector('#summary').innerHTML=`Всего заявок: <b>${ol.length}</b><br>Новые: <b>${ol.filter(o=>o.status==='Новый').length}</b><br>В поездке: <b>${ol.filter(o=>o.status==='В поездке').length}</b>`;document.querySelector('#orders').innerHTML=ol.map(render).join('')||'<div class="notice">Новых заявок нет.</div>'}catch(e){document.querySelector('#identity').textContent='Ошибка: '+e.message}}
function render(o){const opts=users.filter(u=>u.plate).map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${esc(u.car)} · ${esc(u.plate)}</option>`).join('');const form=['Новый','Принят водителем'].includes(o.status)?`<div class="controls"><select id="d-${esc(o.id)}"><option value="">Выберите водителя</option>${opts}</select><input id="p-${esc(o.id)}" placeholder="Госномер"><input id="v-${esc(o.id)}" placeholder="Модель автомобиля"><button class="btn primary" onclick="assign('${esc(o.id)}')">Назначить</button></div>`:'';return `<article class="card order"><div class="order-head"><div><h2>${esc(o.id)}</h2><div class="muted">${esc(o.from)} → ${esc(o.to)}</div></div><span class="badge">${esc(o.status)}</span></div><div class="meta"><div>Клиент<b>${esc(o.clientName||o.clientEmail)}</b></div><div>Дата/время<b>${esc(o.date||'—')} ${esc(o.time||'')}</b></div><div>Машина<b>${esc(o.vehicle||'не назначена')}</b></div><div>Оплата<b>${esc(o.paymentStatus||'—')}</b></div></div>${form}${o.status==='Завершён'?`<div class="notice">Отчёт: ${esc(o.report||'без комментария')}</div>`:''}</article>`}
async function assign(id){try{const d=users.find(u=>u.id===document.querySelector('#d-'+CSS.escape(id)).value);if(!d)throw Error('выберите водителя');const x=await api('/api/orders/'+encodeURIComponent(id)+'/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driverId:d.id,vehicle:d.car,vehiclePlate:document.querySelector('#p-'+CSS.escape(id)).value||d.plate})});alert('Назначено: '+x.vehicle+' · '+x.vehiclePlate);load()}catch(e){alert(e.message)}}document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};load();</script></body></html>
