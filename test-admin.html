<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тестовые аккаунты — ЭКСПРЕССТРАНСФЕРТРЭВЕЛ</title><style>body{margin:0;background:#101416;color:#f5f1e8;font:16px Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:32px}h2{font-size:22px;color:#e2c488}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:8px;background:#d7a84d;color:#202629;font-weight:700;padding:11px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#1a2023;border:1px solid #394346;border-radius:14px;padding:18px}.row{padding:9px 0;border-bottom:1px solid #30383a}.row:last-child{border:0}.muted{color:#aeb6b2;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Тестовый контур</h1><p class="muted">Локальные карточки зарегистрированных водителей и аккаунты клиентов.</p><div class="bar"><button class="btn" id="reload">Обновить данные</button><button class="btn" id="reset">Сбросить демо-данные</button><a class="btn" href="/">Открыть сайт</a></div><section><h2>Водители</h2><div class="grid" id="drivers"></div></section><section><h2>Клиенты</h2><div class="grid" id="clients"></div></section></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=(u,driver)=>`<article class="card"><strong>${esc(u.name)}</strong><div class="row">ID: ${esc(u.id)}</div>${driver?`<div class="row">Город: ${esc(u.city)}</div><div class="row">Автомобиль: ${esc(u.car)}</div><div class="row">Тарифы: ${esc(u.tariffs.join(', '))}</div>`:`<div class="row">E-mail: ${esc(u.email)}</div><div class="row">Телефон: ${esc(u.phone)}</div>`}<div class="row muted">Статус: ${esc(u.status)}</div></article>`;async function load(){const r=await fetch('/api/test-users');const d=await r.json();document.querySelector('#drivers').innerHTML=d.drivers.map(x=>card(x,true)).join('');document.querySelector('#clients').innerHTML=d.clients.map(x=>card(x,false)).join('')}document.querySelector('#reload').onclick=load;document.querySelector('#reset').onclick=async()=>{await fetch('/api/test-users/reset',{method:'POST'});load()};load();</script></body></html>
